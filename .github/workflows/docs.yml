name: Docs

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the docs include the file, and people copy it from there
      - name: Check docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      # The same strict build the Pages deployment runs after a merge, where
      # a single warning - a broken link, say - stops the docs from updating.
      - name: Build docs
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict
